<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>낭만 해적단의 보물찾기 - 롯데월드 부산</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Pirata+One&display=swap');

        body { margin: 0; padding: 0; background-color: #1a1a1a; }
        .font-ko { font-family: 'Nanum Myeongjo', serif; }
        .font-en { font-family: 'Pirata One', cursive; letter-spacing: 0.05em; }
        
        .mobile-app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: #f4e4bc;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.1) 100%),
                url("https://www.transparenttextures.com/patterns/p6.png");
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            color: #3d2b1f;
            overflow-x: hidden;
        }

        .parchment {
            background-color: #fdf5e6;
            background-image: url("https://www.transparenttextures.com/patterns/old-paper.png");
            border: 2px solid #d4af37;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.2), inset 0 0 50px rgba(139,69,19,0.1);
            border-radius: 8px;
        }

        .parchment-main {
            background-image: url("parchment.png");
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-color: transparent;
            border: none;
            box-shadow: none;
            padding: 4rem 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.5));
        }

        .real-parchment {
            background-color: #fdf5e6;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.05)),
                url("https://www.transparenttextures.com/patterns/paper-fibers.png");
            box-shadow: 
                inset 0 0 100px rgba(139,69,19,0.2),
                5px 10px 30px rgba(0,0,0,0.3);
            border-radius: 4px;
            position: relative;
        }
        .real-parchment::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url("https://www.transparenttextures.com/patterns/old-paper.png");
            opacity: 0.4;
            pointer-events: none;
        }

        .wood-btn {
            background: linear-gradient(180deg, #8b4513 0%, #5d2906 100%);
            border: 3px solid #3d1f08;
            border-top: 3px solid #a0522d;
            box-shadow: 0 8px 0 #2a1506, 0 15px 20px rgba(0,0,0,0.4);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            transition: all 0.1s;
        }
        .wood-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #2a1506, 0 8px 10px rgba(0,0,0,0.4);
        }

        .gold-text {
            color: #d4af37;
            text-shadow: 2px 2px 0px #3d2b1f, 4px 4px 0px rgba(0,0,0,0.2);
            -webkit-text-stroke: 1px #3d2b1f;
        }

        .stamp-circle {
            width: 80px;
            height: 80px;
            border: 4px solid #8b0000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: rgba(139, 0, 0, 0.05);
            box-shadow: inset 0 0 15px rgba(139, 0, 0, 0.1);
        }
        .stamp-ink {
            font-size: 2.5rem;
            color: #8b0000;
            opacity: 0.8;
            filter: blur(0.5px);
            transform: rotate(-10deg);
        }

        .stamp-collected {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            border: 8px solid #8b0000;
            padding: 10px 30px;
            color: #8b0000;
            font-size: 4rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            opacity: 0;
            pointer-events: none;
            z-index: 50;
            background: rgba(255, 255, 255, 0.1);
            mask-image: url("https://www.transparenttextures.com/patterns/stardust.png");
        }
        .stamp-anim {
            animation: stampDrop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes stampDrop {
            0% { opacity: 0; transform: translate(-50%, -50%) rotate(-15deg) scale(3); }
            100% { opacity: 0.8; transform: translate(-50%, -50%) rotate(-15deg) scale(1); }
        }

        @keyframes storyFadeIn {
            0% { opacity: 0; transform: translateY(30px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .story-line { opacity: 0; animation: storyFadeIn 1s cubic-bezier(0.17, 0.67, 0.83, 0.67) forwards; }

        @keyframes float {
            0% { transform: translateY(0px) rotate(-2deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(-2deg); }
        }
        .float { animation: float 4s ease-in-out infinite; }

        .keep-all { word-break: keep-all; }
        .btn-active:active { transform: scale(0.95); transition: transform 0.1s; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const motion = (window.Motion && window.Motion.motion) || (window.framerMotion && window.framerMotion.motion) || null;

        const APP_ID = "lotte-world-pirates-2026";
        const ADMIN_CODE = "7777";

        const MISSION_DATA = [
            { id: 'swingship', icon: '⚓', label: '첫 번째 표식', hint: '우리가 타고 온 배 어때?\n너도 한번 타볼래? 더위가 아주 싹 가실거야!' },
            { id: 'splash', icon: '🌊', label: '두 번째 표식', hint: '땀에 젖은 그대여!\n이 참에 아예 물에 홀딱 젖어버리는 것이 어떤가?' },
            { id: 'flume', icon: '🛶', label: '세 번째 표식', hint: '오거들이 만든 뗏목도 꽤 훌륭하더군.. 물론 우리 낭만 해적단의 배에 비할 수 없지만 말이야' },
        ];

        const PirateLogo = () => {
            const Container = motion ? motion.div : 'div';
            
            return (
                <Container 
                    {...(motion ? {
                        initial: { opacity: 0, y: 10 },
                        animate: { opacity: 1, y: 0 },
                        transition: { duration: 0.8, ease: "easeOut" }
                    } : {})}
                    className="relative w-full flex flex-col items-center mb-6 py-4"
                >
                    <img 
                        src="logo_treasure_nobg.png" 
                        alt="Romantic Pirates Logo" 
                        className="w-96 h-auto drop-shadow-2xl"
                    />
                </Container>
            );
        };

        function App() {
            const [step, setStep] = useState('intro');
            const [nickname, setNickname] = useState('');
            const [stamps, setStamps] = useState({ swingship: false, splash: false, flume: false });
            const [isClaimed, setIsClaimed] = useState(false);
            const [showHint, setShowHint] = useState(null);
            const [adminCodeInput, setAdminCodeInput] = useState("");
            const [isCapturing, setIsCapturing] = useState(false);
            const [capturedImage, setCapturedImage] = useState(null);
            const [isResetConfirmOpen, setIsResetConfirmOpen] = useState(false);
            const [isScanning, setIsScanning] = useState(false);
            const [storySkipCount, setStorySkipCount] = useState(0);
            const [visibleLines, setVisibleLines] = useState(0);
            const certificateRef = useRef(null);
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const requestRef = useRef(null);

            const MASTER_QR_DATA = "ROMANTIC_PIRATE_2026";

            const startScanner = () => {
                setIsScanning(true);
                navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then((stream) => {
                    videoRef.current.srcObject = stream;
                    videoRef.current.setAttribute("playsinline", true);
                    videoRef.current.play();
                    requestRef.current = requestAnimationFrame(scanTick);
                });
            };

            const stopScanner = () => {
                setIsScanning(false);
                if (videoRef.current && videoRef.current.srcObject) {
                    videoRef.current.srcObject.getTracks().forEach(track => track.stop());
                }
                cancelAnimationFrame(requestRef.current);
            };

            const scanTick = () => {
                if (videoRef.current && videoRef.current.readyState === videoRef.current.HAVE_ENOUGH_DATA) {
                    const canvas = canvasRef.current;
                    const video = videoRef.current;
                    canvas.height = video.videoHeight;
                    canvas.width = video.videoWidth;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height, {
                        inversionAttempts: "dontInvert",
                    });

                    if (code && code.data === MASTER_QR_DATA) {
                        stopScanner();
                        saveProgress(stamps, null, true);
                        return;
                    }
                }
                requestRef.current = requestAnimationFrame(scanTick);
            };

            useEffect(() => {
                const savedData = localStorage.getItem(APP_ID);
                if (savedData) {
                    const parsed = JSON.parse(savedData);
                    setNickname(parsed.nickname);
                    setStamps(parsed.stamps);
                    setIsClaimed(parsed.isClaimed || false);
                    setStep('map');
                }
            }, []);

            const saveProgress = (newStamps, newStep, newIsClaimed) => {
                const data = { 
                    nickname, 
                    stamps: newStamps || stamps,
                    isClaimed: newIsClaimed !== undefined ? newIsClaimed : isClaimed
                };
                localStorage.setItem(APP_ID, JSON.stringify(data));
                if (newStep) setStep(newStep);
                if (newIsClaimed !== undefined) setIsClaimed(newIsClaimed);
            };

            const toggleStamp = (id) => {
                if (stamps[id]) return;
                const newStamps = { ...stamps, [id]: true };
                setStamps(newStamps);
                saveProgress(newStamps);
            };

            const executeHardReset = () => {
                localStorage.removeItem(APP_ID);
                window.location.reload();
            };

            const allMainRidesDone = stamps.swingship && stamps.splash && stamps.flume;

            if (step === 'intro') return (
                <div className="mobile-app-container font-ko flex flex-col items-center justify-center p-8 text-center overflow-hidden">
                    <div className="absolute top-8 left-8 opacity-10 rotate-[-15deg]">
                        <i data-lucide="compass" style={{width: 80, height: 80}}></i>
                    </div>
                    <div className="absolute bottom-12 right-8 opacity-10 rotate-[20deg]">
                        <i data-lucide="skull" style={{width: 100, height: 100}}></i>
                    </div>
                    
                    <div className="mb-2 float text-[#8b0000] drop-shadow-[0_10px_10px_rgba(0,0,0,0.5)]">
                        <i data-lucide="anchor" style={{width: 100, height: 100}}></i>
                    </div>

                    <PirateLogo />

                    <div className="parchment-main p-10 mb-12 relative">
                        <p className="text-xl leading-relaxed text-[#5d4037] keep-all font-bold italic">
                            "폭염에 지친 매직 포레스트...<br/>
                            낭만 해적단이 엄청난 보물을<br/>숨겨두었다!" <br/><br/>
                            숨겨진 단서를 찾아<br/>보물의 주인이 되어라.
                        </p>
                    </div>

                    <div className="w-full space-y-6 px-4 relative z-10">
                        <div className="p-2 border-2 border-dashed border-[#3d2b1f]/20 rounded-2xl bg-white/20 backdrop-blur-sm">
                            <input 
                                type="text" value={nickname} 
                                onChange={(e)=>setNickname(e.target.value)}
                                placeholder="모험가 이름을 입력하세요" 
                                className="w-full p-5 rounded-xl border-2 border-[#3d2b1f] bg-white/90 text-center font-bold text-xl outline-none"
                            />
                        </div>
                        <button 
                            onClick={() => nickname && saveProgress(stamps, 'map')}
                            className="wood-btn text-white font-black py-6 px-8 rounded-xl w-full text-2xl"
                        >
                            모험 시작하기
                        </button>
                    </div>
                </div>
            );

            if (step === 'map') return (
                <div className="mobile-app-container font-ko p-6 pb-12 min-h-screen flex flex-col">
                    <header className="flex justify-between items-end mb-8 border-b-4 border-double border-[#3d2b1f]/20 pb-4 mt-4">
                        <div className="flex items-center gap-3">
                            <div className="bg-[#8b0000] p-2 rounded-lg shadow-md rotate-[-5deg]">
                                <i data-lucide="compass" className="text-white" style={{width: 24, height: 24}}></i>
                            </div>
                            <div>
                                <p className="text-[10px] font-bold text-[#8b0000] tracking-widest leading-none mb-1 uppercase">모험가</p>
                                <h2 className="text-2xl font-black text-[#3d2b1f]">{nickname}</h2>
                            </div>
                        </div>
                        <div className="text-right">
                            <p className="text-[10px] font-bold text-gray-500 uppercase tracking-tighter">찾은 단서</p>
                            <p className="text-4xl font-en gold-text leading-none">
                                {Object.values(stamps).filter(v => v).length}<span className="text-xl text-gray-400">/3</span>
                            </p>
                        </div>
                    </header>

                    <div className="parchment p-6 rounded-xl mb-8 relative overflow-hidden">
                        <h3 className="text-xl font-bold mb-2 text-center text-[#3d2b1f] keep-all relative z-10">
                           파크 안 숨겨진 표식을 찾아<br/>보물에 더 가까워져라!
                        </h3>
                        <p className="text-xs opacity-60 mb-6 text-center keep-all relative z-10 font-bold">각 단서를 터치하여 힌트를 확인하세요</p>
                        <div className="flex justify-around gap-2 mb-4 relative z-10">
                            {MISSION_DATA.map(m => (
                                <div key={m.id} onClick={() => setShowHint(m)} className="flex flex-col items-center gap-2">
                                    <div className={`stamp-circle transition-all btn-active cursor-pointer ${stamps[m.id] ? 'border-[#8b0000] scale-105' : 'border-[#3d2b1f]/20 grayscale opacity-40'}`}>
                                        <span className="stamp-ink">{m.icon}</span>
                                        {stamps[m.id] && (
                                            <div className="absolute -top-1 -right-1 bg-green-500 rounded-full p-1 shadow-lg border-2 border-white">
                                                <i data-lucide="check" className="text-white" style={{width: 16, height: 16}}></i>
                                            </div>
                                        )}
                                    </div>
                                    <span className="text-[10px] font-bold opacity-60">{m.label}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="flex-grow flex flex-col justify-center">
                        {allMainRidesDone ? (
                            <div className="p-8 rounded-3xl border-4 border-[#8b0000] bg-white/80 text-center animate-pulse shadow-[0_20px_50px_rgba(139,0,0,0.3)] relative overflow-hidden">
                                <h3 className="text-2xl font-black mb-4 text-[#3d2b1f] keep-all">최종 보물 은닉처 발견!</h3>
                                <div className="bg-[#fdf5e6] p-5 rounded-2xl border-2 border-dashed border-[#8b0000]/30 mb-6 shadow-inner">
                                    <p className="text-lg font-bold text-[#8b0000] italic keep-all">
                                        "무대가 있는 정원 앞에<br/>우리가 보물을 모아두었다네!<br/>어서 가서 찾아보세나!"
                                    </p>
                                </div>
                                <button onClick={()=>setStep('admin')} className="wood-btn text-white font-black py-5 px-8 rounded-2xl w-full text-xl">보물 상자 열기 (스태프 확인)</button>
                            </div>
                        ) : (
                            <div className="p-8 text-center bg-[#3d2b1f]/5 rounded-3xl border-2 border-dashed border-[#3d2b1f]/10">
                                <i data-lucide="lock" className="mx-auto mb-4 text-[#3d2b1f]/30" style={{width: 48, height: 48}}></i>
                                <p className="text-base font-bold text-[#3d2b1f]/40 keep-all">3개의 표식을 모두 찾아야<br/>최종 목적지의 위치가 나타납니다.</p>
                            </div>
                        )}
                    </div>

                    {showHint && (
                        <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-6 z-50 backdrop-blur-md">
                            <div className="parchment w-full p-10 rounded-2xl text-center shadow-2xl relative border-8 border-double border-[#3d2b1f]/20">
                                <div className="absolute -top-12 left-1/2 -translate-x-1/2 stamp-circle bg-[#fdf5e6] border-4 border-[#8b0000] shadow-xl">
                                    <span className="stamp-ink">{showHint.icon}</span>
                                </div>
                                <div className="mt-8">
                                    <h4 className="text-lg font-black mb-2 text-[#8b0000]">{showHint.label}</h4>
                                    <p className="text-xl mb-10 text-[#3d2b1f] font-bold italic keep-all leading-relaxed">"{showHint.hint}"</p>
                                    <div className="flex flex-col gap-4">
                                        <label className="wood-btn text-white py-5 rounded-2xl font-black flex items-center justify-center gap-3 text-lg cursor-pointer">
                                            <i data-lucide="camera" style={{width: 24, height: 24}}></i>
                                            표식 인식하기
                                            <input 
                                                type="file" 
                                                accept="image/*" 
                                                capture="environment" 
                                                className="hidden" 
                                                onChange={(e) => {
                                                    if (e.target.files && e.target.files[0]) {
                                                        // 시연을 위해 파일 선택 시 바로 인증되도록 처리
                                                        toggleStamp(showHint.id);
                                                        setShowHint(null);
                                                        alert("표식이 성공적으로 인식되었습니다!");
                                                    }
                                                }}
                                            />
                                        </label>
                                        {!stamps[showHint.id] && (
                                            <button onClick={()=> {toggleStamp(showHint.id); setShowHint(null);}} className="text-[#8b0000] text-xs font-bold underline py-2 opacity-50">
                                                (시연용) 강제 인증하기
                                            </button>
                                        )}
                                        <button onClick={()=>setShowHint(null)} className="mt-4 text-[#3d2b1f] font-bold text-sm bg-[#3d2b1f]/5 py-4 rounded-xl">지도로 돌아가기</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );

            if (step === 'admin') return (
                <div className="mobile-app-container font-ko p-6 flex flex-col items-center justify-center min-h-screen text-center">
                    <div className="parchment w-full p-10 rounded-2xl shadow-2xl border-8 border-double border-[#3d2b1f]/20">
                        <div className="mb-6">
                            <i data-lucide="shield-check" className="mx-auto text-[#8b0000]" style={{width: 60, height: 60}}></i>
                        </div>
                        <h2 className="text-3xl font-black mb-4 tracking-widest text-[#3d2b1f] uppercase">스태프 확인</h2>
                        <p className="text-base mb-10 text-[#5d4037] italic font-bold keep-all">카니발 게임 완료 후<br/>스태프에게 확인 코드를 요청하게나.</p>
                        
                        <div className="relative mb-10">
                            <input 
                                type="number" value={adminCodeInput} 
                                onChange={(e)=>setAdminCodeInput(e.target.value)} 
                                placeholder="0000" 
                                className="w-full text-center p-6 rounded-2xl bg-white/50 border-4 border-[#3d2b1f] font-black text-5xl tracking-[1rem] outline-none shadow-inner text-[#3d2b1f]" 
                            />
                        </div>

                        <button 
                            onClick={() => adminCodeInput === ADMIN_CODE ? setStep('ending') : alert('암호가 틀렸네, 다시 확인해보게!')} 
                            className="wood-btn text-white font-black py-5 px-8 rounded-2xl w-full text-2xl"
                        >
                            보물 상자 열기
                        </button>
                        <button onClick={()=>setStep('map')} className="mt-8 text-sm font-bold text-[#3d2b1f]/60 underline block w-full">지도로 돌아가기</button>
                    </div>
                </div>
            );

            if (step === 'ending') return (
                <div 
                    className="mobile-app-container font-ko p-8 flex flex-col items-center justify-center text-center min-h-screen cursor-pointer"
                    onClick={() => setVisibleLines(prev => prev + 1)}
                >
                    <div className="real-parchment p-10 space-y-10 text-xl font-bold keep-all leading-relaxed text-[#3d2b1f] w-full relative">
                        <p className="story-line text-2xl font-black" style={visibleLines >= 1 ? {opacity:1, animation:'none'} : {animationDelay:'0.5s'}}>마침내 찾아낸 보물 상자...</p>
                        <p className="story-line" style={visibleLines >= 2 ? {opacity:1, animation:'none'} : {animationDelay:'2s'}}>하지만 상자 안에는 보물 대신<br/>낡은 편지 한 장이 들어있었다네.</p>
                        
                        <div className="p-8 rounded-xl border-l-8 border-[#8b0000] shadow-md story-line italic text-lg bg-white/30" style={visibleLines >= 3 ? {opacity:1, animation:'none'} : {animationDelay:'4.5s'}}>
                            <i data-lucide="quote" className="text-[#8b0000]/20 absolute top-4 left-4" style={{width: 40, height: 40}}></i>
                            "더위에 지친 사람들을 구하기 위해<br/>망설임 없이 나선 그 열정과 용기."
                        </div>

                        <p className="story-line text-2xl gold-text italic font-black" style={visibleLines >= 4 ? {opacity:1, animation:'none'} : {animationDelay:'7s'}}>진정한 보물은 그대의 마음속에 있네</p>
                        
                        <div className="story-line space-y-2" style={visibleLines >= 5 ? {opacity:1, animation:'none'} : {animationDelay:'9s'}}>
                            <p className="text-4xl text-[#8b0000] font-black">환영하네!</p>
                            <p className="text-xl">우리 낭만 해적단의 <br/>진정한 일원이 된 것을!</p>
                        </div>

                        <button 
                            onClick={(e)=>{e.stopPropagation(); setStep('reward');}} 
                            className="wood-btn text-white font-black py-6 px-8 rounded-2xl w-full mt-10 text-2xl story-line" 
                            style={visibleLines >= 6 ? {opacity:1, animation:'none'} : {animationDelay:'11s'}}
                        >
                            임명장 확인하기
                        </button>
                    </div>
                </div>
            );

            if (step === 'reward') return (
                <div className="mobile-app-container font-ko p-6 pb-12 flex flex-col items-center min-h-screen">
                    <div ref={certificateRef} className="relative w-full bg-[#fdf5e6] p-10 border-[16px] border-double border-[#8b0000] shadow-2xl text-center mt-6 overflow-hidden">
                        {/* 배경 이미지 추가 */}
                        <div className="absolute inset-0 z-0 flex items-center justify-center opacity-[0.15]">
                            <img src="image_nobg.png" className="w-full h-auto object-contain scale-125" />
                        </div>
                        
                        <div className="relative z-10">
                            <div className="absolute top-0 left-0 opacity-10 rotate-[-45deg]">
                                <i data-lucide="anchor" style={{width: 60, height: 60}}></i>
                            </div>
                            <div className="absolute bottom-0 right-0 opacity-10 rotate-[15deg]">
                                <i data-lucide="compass" style={{width: 60, height: 60}}></i>
                            </div>

                            <h2 className="text-5xl font-en gold-text mb-4 uppercase tracking-tighter">Certificate</h2>
                            <p className="text-sm font-bold text-[#3d2b1f]/60 mb-10 border-b-2 border-[#3d2b1f]/10 pb-4 tracking-[0.3em] uppercase text-center">낭만 해적단 공식 증명서</p>
                            
                            <div className="space-y-6 mb-12">
                                <p className="text-xl mb-4 font-bold leading-loose keep-all text-[#3d2b1f]">위 사람은 보물찾기로 위장된 <br/><span className="font-black text-3xl text-[#8b0000] my-2 inline-block drop-shadow-sm">낭만 해적단</span>의 <br/>입단 테스트를 훌륭히 통과하였기에 <br/>정식 단원으로 임명함.</p>
                                <div className="relative py-4">
                                    <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-[#3d2b1f]/10"></div></div>
                                    <p className="relative bg-[#fdf5e6]/80 px-4 text-5xl font-black italic text-[#3d2b1f]">"{nickname}"</p>
                                </div>
                            </div>

                            <div className="flex justify-center items-end border-t border-[#3d2b1f]/10 pt-4">
                                <div className="text-center">
                                    <p className="text-[10px] font-bold text-[#3d2b1f]/40 tracking-widest uppercase mb-1">임명 날짜</p>
                                    <p className="text-sm font-black text-[#3d2b1f]">{new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' })}</p>
                                </div>
                            </div>
                        </div>

                        {/* 수령 완료 도장 */}
                        {isClaimed && (
                            <div className="stamp-collected stamp-anim">
                                COLLECTED
                            </div>
                        )}
                    </div>

                    <div className="mt-10 w-full space-y-6 relative z-10">
                        {!isClaimed ? (
                            <div className="parchment border-4 border-[#8b0000]/20 p-8 rounded-3xl text-[#3d2b1f] shadow-xl text-center keep-all relative">
                                <div className="absolute -top-5 left-1/2 -translate-x-1/2 bg-[#8b0000] text-[#d4af37] px-6 py-2 rounded-full text-sm font-black shadow-lg border-2 border-[#d4af37] uppercase tracking-wider">보상 수령 방법</div>
                                <p className="text-lg font-bold leading-relaxed mt-4">현재 화면의 <span className="text-[#8b0000] font-black underline decoration-[#d4af37] decoration-4">디지털 임명장</span>을<br/>해적 단원(스태프)에게 보여주세요.<br/>확인 후 낭만 해적의 무기를 드립니다!</p>
                                <p className="text-xs text-[#3d2b1f]/50 mt-4 font-bold">(화면 캡처본은 수령이 불가합니다)</p>
                                
                                <button 
                                    onClick={startScanner} 
                                    className="mt-6 w-full py-4 bg-[#3d2b1f] text-white rounded-xl font-bold text-base shadow-md active:scale-95 transition-transform flex items-center justify-center gap-2"
                                >
                                    <i data-lucide="qr-code" style={{width: 20, height: 20}}></i>
                                    스태프 QR 스캔하여 수령 확인
                                </button>
                            </div>
                        ) : (
                            <div className="bg-[#8b0000]/5 border-4 border-dashed border-[#8b0000]/20 p-8 rounded-3xl text-[#8b0000] shadow-inner text-center keep-all">
                                <i data-lucide="check-circle" className="mx-auto mb-2" style={{width: 32, height: 32}}></i>
                                <p className="text-xl font-black mb-1">보상 수령 완료</p>
                                <p className="text-sm font-bold opacity-70">이 임명장으로는 더 이상<br/>보상을 수령하실 수 없습니다.</p>
                            </div>
                        )}

                        <button onClick={()=> {setStep('intro'); window.scrollTo(0,0);}} className="w-full text-base font-bold text-[#3d2b1f]/60 underline mt-4">처음 화면으로</button>
                        
                        <div className="pt-16 pb-8 flex flex-col items-center">
                            <button onClick={() => setIsResetConfirmOpen(true)} className="text-[#3d2b1f]/30 text-[10px] font-bold uppercase tracking-widest hover:text-[#8b0000] transition-colors">데이터 초기화 (시연용)</button>
                        </div>
                    </div>

                    {isScanning && (
                        <div className="fixed inset-0 bg-black/90 flex flex-col items-center justify-center p-6 z-[200]">
                            <div className="w-full max-w-sm aspect-square bg-black rounded-3xl overflow-hidden relative border-4 border-[#d4af37]">
                                <video ref={videoRef} className="w-full h-full object-cover" />
                                <canvas ref={canvasRef} className="hidden" />
                                <div className="absolute inset-0 border-[40px] border-black/40"></div>
                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-48 border-2 border-[#d4af37] rounded-2xl animate-pulse"></div>
                            </div>
                            <p className="text-white mt-8 text-lg font-bold text-center keep-all">스태프가 제시하는<br/><span className="text-[#d4af37]">마스터 QR 코드</span>를 인식시켜주세요</p>
                            
                            {/* 시연용 우회 버튼 */}
                            <button 
                                onClick={() => {
                                    stopScanner();
                                    saveProgress(stamps, null, true);
                                }}
                                className="mt-4 text-[#d4af37]/40 text-[10px] font-bold uppercase tracking-widest hover:text-[#d4af37] transition-colors"
                            >
                                (시연용) 강제 수령 확인
                            </button>

                            <button 
                                onClick={stopScanner}
                                className="mt-8 px-8 py-3 bg-white/10 text-white rounded-full font-bold border border-white/20 text-sm"
                            >
                                취소하기
                            </button>
                        </div>
                    )}

                    {isResetConfirmOpen && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-6 z-[120]">
                            <div className="bg-white rounded-2xl p-6 w-full max-w-xs text-center shadow-2xl">
                                <h4 className="text-lg font-black mb-2 text-[#3d2b1f]">데이터 완전 초기화</h4>
                                <p className="text-sm text-gray-600 mb-6 keep-all leading-relaxed">데모 시연 데이터를 모두 삭제하고<br/>첫 화면으로 돌아가시겠습니까?</p>
                                <div className="flex gap-2">
                                    <button onClick={() => setIsResetConfirmOpen(false)} className="flex-1 py-3 rounded-xl bg-gray-100 text-gray-500 font-bold">취소</button>
                                    <button onClick={executeHardReset} className="flex-1 py-3 rounded-xl bg-[#8b0000] text-white font-bold shadow-md">초기화 실행</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        const initIcons = () => { if (window.lucide) { window.lucide.createIcons(); } else { setTimeout(initIcons, 100); } };
        initIcons();
    </script>
</body>
</html>
