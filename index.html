                const browserLang = navigator.language || navigator.userLanguage;
                return (browserLang && browserLang.startsWith('en')) ? 'en' : 'ko';
            };

            const [step, setStep] = useState('intro');
            const [lang, setLang] = useState(getInitialLanguage);
            const [nickname, setNickname] = useState('');
            const [pendingSpot, setPendingSpot] = useState(null);
            const [stamps, setStamps] = useState({ swingship: false, splash: false, flume: false });
            const [isClaimed, setIsClaimed] = useState(false);
            const [showHint, setShowHint] = useState(null);
            const [adminCodeInput, setAdminCodeInput] = useState("");
            const [isCapturing, setIsCapturing] = useState(false);
            const [capturedImage, setCapturedImage] = useState(null);
            const [isResetConfirmOpen, setIsResetConfirmOpen] = useState(false);
            const [isScanning, setIsScanning] = useState(false);
            const [storySkipCount, setStorySkipCount] = useState(0);
            const [visibleLines, setVisibleLines] = useState(0);
            const [newlyUnlockedStamp, setNewlyUnlockedStamp] = useState(null);
            
            // Hidden Bypass / Reset states
            const [secretTapCount, setSecretTapCount] = useState(0);
            const secretTapTimeoutRef = useRef(null);
            const [resetTapCount, setResetTapCount] = useState(0);
            const resetTapTimeoutRef = useRef(null);

            const [claimedAt, setClaimedAt] = useState(null);
            const [secondsAgo, setSecondsAgo] = useState(0);
            const [showPasscodeModal, setShowPasscodeModal] = useState(false);
            const [passcodeInput, setPasscodeInput] = useState("");

            const certificateRef = useRef(null);
            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const requestRef = useRef(null);

            const MASTER_QR_DATA = "ROMANTIC_PIRATE_2026";
            const CHEST_QR_DATA = "OPEN_TREASURE_CHEST_2026";
            const scanModeRef = useRef(null);

            const t = TRANSLATIONS[lang];

            const changeLang = (newLang) => {
                setLang(newLang);
                localStorage.setItem(APP_ID + '_lang', newLang);
            };

            const handleSecretTap = () => {
                if (secretTapTimeoutRef.current) clearTimeout(secretTapTimeoutRef.current);
                secretTapTimeoutRef.current = setTimeout(() => setSecretTapCount(0), 2000);
                
                setSecretTapCount(prev => {
                    const next = prev + 1;
                    if (next >= 5) {
                        const mode = scanModeRef.current;
                        stopScanner();
                        if (mode === 'chest') {
                            setStep('ending');
                        } else if (mode === 'reward') {
                            alert(t.alert_reward_claimed);
                            saveProgress(stamps, null, true);
                        } else if (['swingship', 'splash', 'flume'].includes(mode)) {
                            unlockStamp(mode);
                        }
                        clearTimeout(secretTapTimeoutRef.current);
                        return 0;
                    }
                    return next;
                });
            };

            const handleResetTap = () => {
                if (resetTapTimeoutRef.current) clearTimeout(resetTapTimeoutRef.current);
                resetTapTimeoutRef.current = setTimeout(() => setResetTapCount(0), 2000);
                
                setResetTapCount(prev => {
                    const next = prev + 1;
                    if (next >= 5) {
                        setIsResetConfirmOpen(true);
                        clearTimeout(resetTapTimeoutRef.current);
                        return 0;
                    }
                    return next;
                });
            };

            const startScanner = (mode) => {
                scanModeRef.current = mode;
                setIsScanning(true);
                navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then((stream) => {
                    videoRef.current.srcObject = stream;
                    videoRef.current.setAttribute("playsinline", true);
                    videoRef.current.play();
                    requestRef.current = requestAnimationFrame(scanTick);
                });
            };

            const stopScanner = () => {
                setIsScanning(false);
                if (videoRef.current && videoRef.current.srcObject) {
                    videoRef.current.srcObject.getTracks().forEach(track => track.stop());
                }
                cancelAnimationFrame(requestRef.current);
            };

            const scanTick = () => {
                if (videoRef.current && videoRef.current.readyState === videoRef.current.HAVE_ENOUGH_DATA) {
                    const canvas = canvasRef.current;
                    const video = videoRef.current;
                    canvas.height = video.videoHeight;
                    canvas.width = video.videoWidth;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height, {
                        inversionAttempts: "dontInvert",
                    });

                    if (code) {
                        if (scanModeRef.current === 'chest') {
                            const isLegacy = code.data === CHEST_QR_DATA;
                            const isURL = code.data.includes('action=chest');
                            if (isLegacy || isURL) {
                                stopScanner();
                                setStep('ending');
                                return;
                            }
                        } else if (scanModeRef.current === 'reward') {
                            const isLegacy = code.data === MASTER_QR_DATA;
                            const isURL = code.data.includes('action=reward');
                            if (isLegacy || isURL) {
                                stopScanner();
                                alert(t.alert_reward_claimed);
                                saveProgress(stamps, null, true);
                                return;
                            }
                        } else if (['swingship', 'splash', 'flume'].includes(scanModeRef.current)) {
                            const expectedCode = `STAMP_${scanModeRef.current.toUpperCase()}_2026`;
                            const targetId = scanModeRef.current;
                            
                            console.log("[QR Scanner] Scanned raw data:", code.data);
                            console.log("[QR Scanner] Expecting target:", targetId);
                            
                            // 1. Check legacy plain text stamp code
                            if (code.data === expectedCode) {
                                console.log("[QR Scanner] Legacy code match success!");
                                stopScanner();
                                unlockStamp(targetId);
                                return;
                            }
                            
                            // 2. Check new URL pattern with spot parameter (robust regex extraction)
                            if (code.data.includes('spot=')) {
                                const spotMatch = code.data.match(/[?&]spot=([^&/\s?#]+)/);
                                const spot = spotMatch ? spotMatch[1] : null;
                                console.log("[QR Scanner] Extracted spot:", spot);
                                
                                if (spot === targetId) {
                                    console.log("[QR Scanner] URL spot match success!");
                                    stopScanner();
                                    unlockStamp(targetId);
                                    return;
                                }
                            }
                        }
                    }
                }
                requestRef.current = requestAnimationFrame(scanTick);
            };

            useEffect(() => {
                const currentLang = getInitialLanguage();
                const tCurrent = TRANSLATIONS[currentLang];
                const savedData = localStorage.getItem(APP_ID);
                let currentNickname = "";
                let currentStamps = stamps;
                let currentIsClaimed = false;
                let currentClaimedAt = null;

                if (savedData) {
                    const parsed = JSON.parse(savedData);
                    currentNickname = parsed.nickname;
                    currentStamps = parsed.stamps;
                    currentIsClaimed = parsed.isClaimed || false;
                    currentClaimedAt = parsed.claimedAt || null;
                    
                    setNickname(currentNickname);
                    setStamps(currentStamps);
                    setIsClaimed(currentIsClaimed);
                    setClaimedAt(currentClaimedAt);
                    setStep('map');
                }

                // Process URL parameters
                const urlParams = new URLSearchParams(window.location.search);
                
                // 1. ?spot=... (Attractions)
                const spot = urlParams.get('spot');
                if (spot && ['swingship', 'splash', 'flume'].includes(spot)) {
                    if (!savedData || !currentNickname) {
                        // User hasn't started the game yet: set pending spot
                        setPendingSpot(spot);
                    } else {
                        // Existing adventurer: unlock stamp immediately
                        if (!currentStamps[spot]) {
                            const newStamps = { ...currentStamps, [spot]: true };
                            setStamps(newStamps);
                            
                            const data = { 
                                nickname: currentNickname, 
                                stamps: newStamps,
                                isClaimed: currentIsClaimed
                            };
                            localStorage.setItem(APP_ID, JSON.stringify(data));
                            setNewlyUnlockedStamp(spot);
                        }
                        // Clear the URL parameter so refresh doesn't re-trigger
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }
                }

                // 2. ?action=... (Chest / Reward)
                const action = urlParams.get('action');
                if (action) {
                    const hasAllStamps = currentStamps.swingship && currentStamps.splash && currentStamps.flume;
                    
                    if (action === 'chest') {
                        if (currentNickname && hasAllStamps) {
                            // Valid user who collected all stamps: unlock chest
                            setStep('ending');
                            alert(tCurrent.alert_chest_unlocked);
                        } else {
                            // Invalid scan attempt
                            alert(tCurrent.alert_chest_locked);
                            if (currentNickname) {
                                setStep('map');
                            } else {
                                setStep('intro');
                            }
                        }
                    } else if (action === 'reward') {
                        if (currentNickname && hasAllStamps) {
                            // Valid user who finished the adventure: claim reward
                            alert(tCurrent.alert_reward_claimed);
                            saveProgress(currentStamps, 'ending', true);
                        } else {
                            // Invalid scan attempt
                             alert(tCurrent.alert_reward_locked);
                            if (currentNickname) {
                                setStep('map');
                            } else {
                                setStep('intro');
                            }
                        }
                    } else if (action === 'reset') {
                        localStorage.removeItem(APP_ID);
                        alert(tCurrent.alert_reset);
                        window.location.href = window.location.pathname;
                        return;
                    }
                    // Clear the URL parameter
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            }, []);

            const saveProgress = (newStamps, newStep, newIsClaimed) => {
                const nowTimestamp = (newIsClaimed === true && !isClaimed) ? Date.now() : claimedAt;
                const data = { 
                    nickname, 
                    stamps: newStamps || stamps,
                    isClaimed: newIsClaimed !== undefined ? newIsClaimed : isClaimed,
                    claimedAt: nowTimestamp
                };
                localStorage.setItem(APP_ID, JSON.stringify(data));
                if (newStep) setStep(newStep);
                if (newIsClaimed !== undefined) setIsClaimed(newIsClaimed);
                if (newIsClaimed === true && !isClaimed) setClaimedAt(nowTimestamp);
            };

            useEffect(() => {
                if (!isClaimed || !claimedAt) return;
                
                setSecondsAgo(Math.floor((Date.now() - claimedAt) / 1000));
                
                const interval = setInterval(() => {
                    setSecondsAgo(Math.floor((Date.now() - claimedAt) / 1000));
                }, 1000);
                return () => clearInterval(interval);
            }, [isClaimed, claimedAt]);

            const toggleStamp = (id) => {
                if (stamps[id]) return;
                const newStamps = { ...stamps, [id]: true };
                setStamps(newStamps);
                saveProgress(newStamps);
            };

            const unlockStamp = (id) => {
                if (stamps[id]) return;
                toggleStamp(id);
                setShowHint(null);
                setNewlyUnlockedStamp(id);
            };

            const startAdventure = () => {
                if (!nickname) return;
                let finalStamps = { ...stamps };
                if (pendingSpot) {
                    finalStamps[pendingSpot] = true;
                    setStamps(finalStamps);
                }
                
                const data = { 
                    nickname, 
                    stamps: finalStamps,
                    isClaimed: false
                };
                localStorage.setItem(APP_ID, JSON.stringify(data));
                setStep('map');
                
                if (pendingSpot) {
                    setNewlyUnlockedStamp(pendingSpot);
                    setPendingSpot(null);
                }
                
                window.history.replaceState({}, document.title, window.location.pathname);
            };

            const executeHardReset = () => {
                localStorage.removeItem(APP_ID);
                window.location.reload();
            };

            const allMainRidesDone = stamps.swingship && stamps.splash && stamps.flume;

            const resetModalJSX = isResetConfirmOpen ? (
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-6 z-[120]">
                    <div className="bg-white rounded-2xl p-6 w-full max-w-xs text-center shadow-2xl">
                        <h4 className="text-lg font-black mb-2 text-[#3d2b1f] keep-all">{t.reset_title}</h4>
                        <p className="text-sm text-gray-600 mb-6 keep-all leading-relaxed">
                            {t.reset_body.split('\n').map((line, idx) => <React.Fragment key={idx}>{line}<br/></React.Fragment>)}
                        </p>
                        <div className="flex gap-2">
                            <button onClick={() => setIsResetConfirmOpen(false)} className="flex-1 py-3 rounded-xl bg-gray-100 text-gray-500 font-bold">{t.reset_cancel}</button>
                            <button onClick={executeHardReset} className="flex-1 py-3 rounded-xl bg-[#8b0000] text-white font-bold shadow-md">{t.reset_confirm}</button>
                        </div>
                    </div>
                </div>
            ) : null;

            const passcodeModalJSX = showPasscodeModal ? (
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-6 z-[150] backdrop-blur-sm">
                    <div className="bg-white rounded-3xl p-8 w-full max-w-xs text-center shadow-2xl border-4 border-[#3d2b1f] animate-[scaleUp_0.3s_ease-out]">
                        <h4 className="text-xl font-black mb-2 text-[#3d2b1f] keep-all">스태프 확인 코드 입력</h4>
                        <p className="text-xs text-gray-500 mb-6 keep-all">레인보우카페 직원이 직접 입력하는 칸입니다.</p>
                        
                        <form onSubmit={(e) => {
                            e.preventDefault();
                            if (passcodeInput === ADMIN_CODE) {
                                setShowPasscodeModal(false);
                                setPasscodeInput("");
                                saveProgress(stamps, null, true);
                            } else {
                                alert("❌ 비밀번호가 올바르지 않습니다!");
                                setPasscodeInput("");
                            }
                        }} className="space-y-6">
                            <input 
                                type="password"
                                pattern="[0-9]*"
                                inputMode="numeric"
                                maxLength={4}
                                value={passcodeInput}
                                onChange={(e) => setPasscodeInput(e.target.value)}
                                placeholder="4자리 숫자"
                                className="w-full p-4 text-center text-3xl font-bold tracking-[0.5em] border-2 border-gray-300 rounded-xl outline-none focus:border-[#8b0000] focus:ring-1 focus:ring-[#8b0000]"
                                autoFocus
                            />
                            <div className="flex gap-2">
                                <button 
                                    type="button" 
                                    onClick={() => { setShowPasscodeModal(false); setPasscodeInput(""); }} 
                                    className="flex-1 py-4 rounded-xl bg-gray-100 text-gray-500 font-bold text-sm"
                                >
                                    취소
                                </button>
                                <button 
                                    type="submit"
                                    className="flex-1 py-4 rounded-xl bg-[#8b0000] text-white font-bold text-sm shadow-md"
                                >
                                    확인
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            ) : null;

            const elapsedSeconds = secondsAgo;
            const isJustClaimed = isClaimed && elapsedSeconds !== null && elapsedSeconds < 60;

            const successAnimationJSX = isJustClaimed ? (
                <div className="fixed inset-0 z-[200] bg-black/85 flex flex-col items-center justify-center p-6 text-center animate-[fadeIn_0.3s_ease-out]">
                    <div className="absolute inset-0 pointer-events-none overflow-hidden">
                        {[...Array(25)].map((_, i) => (
                            <div 
                                key={i} 
                                className="absolute bg-yellow-400 w-3 h-3 rounded-full animate-[confettiDrop_3s_linear_infinite]"
                                style={{
                                    left: `${Math.random() * 100}%`,
                                    top: `-10px`,
                                    animationDelay: `${Math.random() * 3}s`,
                                    backgroundColor: ['#d4af37', '#8b0000', '#f4e4bc', '#a0522d'][i % 4],
                                    transform: `scale(${0.5 + Math.random()})`
                                }}
                            />
                        ))}
                    </div>
                    <div className="bg-[#fdf5e6] p-8 rounded-3xl border-8 border-double border-[#8b0000] shadow-[0_0_50px_rgba(212,175,55,0.8)] max-w-sm w-full animate-[scaleUp_0.4s_cubic-bezier(0.175,0.885,0.32,1.25)] relative overflow-hidden">
                        <div className="absolute top-2 left-2 opacity-[0.05]"><i data-lucide="sparkles" style={{width: 50, height: 50}}></i></div>
                        <h3 className="text-3xl font-black text-[#8b0000] mb-2 tracking-wider animate-bounce">
                            {lang === 'ko' ? "🎉 지금 보상을 받으세요!" : "🎉 Claim Your Reward Now!"}
                        </h3>
                        <p className="text-xs text-gray-500 font-bold mb-6">
                            {lang === 'ko' ? "스태프 확인이 성공적으로 완료되었습니다." : "Staff verification successfully completed."}
                        </p>
                        
                        <div className="my-6 py-4 px-6 bg-green-50 rounded-2xl border-2 border-green-500/30 flex flex-col items-center justify-center shadow-inner">
                            <span className="text-xs font-bold text-green-600 uppercase tracking-widest mb-1">{t.timer_title}</span>
                            <span className="text-4xl font-black text-green-700 font-mono animate-pulse">{t.timer_just_now(60 - elapsedSeconds)}</span>
                        </div>
                        
                        <p className="text-sm font-bold text-[#3d2b1f] keep-all leading-relaxed">
                            {lang === 'ko' ? (
                                <>
                                    이 애니메이션이 나오는 화면을 레인보우카페 직원에게 보여주시고<br/>
                                    <strong>해적단원의 무기</strong>를 수령해 주세요!
                                </>
                            ) : (
                                <>
                                    Show this screen with the animation to the Rainbow Cafe staff<br/>
                                    and claim your <strong>pirate weapon toy</strong>!
                                </>
                            )}
                        </p>
                    </div>
                </div>
            ) : null;

            if (step === 'intro') return (
                <div className="mobile-app-container font-ko flex flex-col items-center justify-center p-8 text-center overflow-hidden relative">
                    <div className="absolute top-4 right-4 z-[100] flex gap-2">
                        <button 
                            onClick={() => changeLang('ko')} 
                            className={`px-3 py-1.5 rounded-full text-xs font-bold transition-all border ${lang === 'ko' ? 'bg-[#8b0000] text-white border-[#8b0000] shadow-md' : 'bg-white/80 text-[#3d2b1f] border-gray-300'}`}
                        >
                            한글
                        </button>
                        <button 
                            onClick={() => changeLang('en')} 
                            className={`px-3 py-1.5 rounded-full text-xs font-bold transition-all border ${lang === 'en' ? 'bg-[#8b0000] text-white border-[#8b0000] shadow-md' : 'bg-white/80 text-[#3d2b1f] border-gray-300'}`}
                        >
                            English
                        </button>
                    </div>

                    <div className="absolute top-8 left-8 opacity-10 rotate-[-15deg]">
                        <i data-lucide="compass" style={{width: 80, height: 80}}></i>
                    </div>
                    <div className="absolute bottom-12 right-8 opacity-10 rotate-[20deg]">
                        <i data-lucide="skull" style={{width: 100, height: 100}}></i>
                    </div>
                    
                    <div className="mb-2 float text-[#8b0000] drop-shadow-[0_10px_10px_rgba(0,0,0,0.5)] cursor-default">
                        <i data-lucide="anchor" style={{width: 100, height: 100}}></i>
                    </div>

                    <PirateLogo />

                    <div className="parchment-main p-10 mb-12 relative">
                        <p className="text-xl leading-relaxed text-[#5d4037] keep-all font-bold italic">
                            {t.intro_desc.split('\n').map((line, idx) => <React.Fragment key={idx}>{line}<br/></React.Fragment>)}
                        </p>
                    </div>

                    {pendingSpot && (
                        <div className="mb-6 p-5 rounded-2xl border-2 border-dashed border-[#8b0000] bg-[#fdf6e2]/95 text-[#8b0000] font-bold text-base leading-relaxed animate-pulse shadow-md w-full max-w-md relative z-10 keep-all">
                            📌 <strong>{t.pending_unlocked_title}</strong><br/>
                            {t.pending_unlocked_desc(t.spot_names[pendingSpot]).split('\n').map((line, idx) => <React.Fragment key={idx}>{line}<br/></React.Fragment>)}
                        </div>
                    )}

                    <div className="w-full space-y-6 px-4 relative z-10">
                        <div className="p-2 border-2 border-dashed border-[#3d2b1f]/20 rounded-2xl bg-white/20 backdrop-blur-sm">
                            <input 
                                type="text" value={nickname} 
                                onChange={(e)=>setNickname(e.target.value)}
                                placeholder={t.intro_placeholder} 
                                className="w-full p-5 rounded-xl border-2 border-[#3d2b1f] bg-white/90 text-center font-bold text-xl outline-none"
                            />
                        </div>
                        <button 
                            onClick={startAdventure}
                            className="wood-btn text-white font-black py-6 px-8 rounded-xl w-full text-2xl"
                        >
                            {t.intro_btn}
                        </button>
                    </div>
                    {resetModalJSX}
                </div>
            );

            if (step === 'map') return (
                <div className="mobile-app-container font-ko p-6 pb-12 min-h-screen flex flex-col">
                    <header className="flex justify-between items-end mb-8 border-b-4 border-double border-[#3d2b1f]/20 pb-4 mt-4">
                        <div className="flex items-center gap-3">
                            <div className="bg-[#8b0000] p-2 rounded-lg shadow-md rotate-[-5deg]">
                                <i data-lucide="compass" className="text-white" style={{width: 24, height: 24}}></i>
                            </div>
                            <div>
                                <p className="text-[10px] font-bold text-[#8b0000] tracking-widest leading-none mb-1 uppercase">{t.map_header_user}</p>
                                <h2 onClick={handleResetTap} className="text-2xl font-black text-[#3d2b1f] cursor-default select-none">{nickname}</h2>
                            </div>
                        </div>
                        <div className="text-right flex flex-col items-end gap-2">
                            <div className="flex gap-1.5 mb-1">
                                <button 
                                    onClick={() => changeLang('ko')} 
                                    className={`px-2 py-0.5 rounded text-[10px] font-bold transition-all border ${lang === 'ko' ? 'bg-[#8b0000] text-white border-[#8b0000]' : 'bg-white/80 text-[#3d2b1f] border-gray-300'}`}
                                >
                                    한글
                                </button>
                                <button 
                                    onClick={() => changeLang('en')} 
                                    className={`px-2 py-0.5 rounded text-[10px] font-bold transition-all border ${lang === 'en' ? 'bg-[#8b0000] text-white border-[#8b0000]' : 'bg-white/80 text-[#3d2b1f] border-gray-300'}`}
                                >
                                    EN
                                </button>
                            </div>
                            <div>
                                <p className="text-[10px] font-bold text-gray-500 uppercase tracking-tighter">{t.map_header_clues}</p>
                                <p className="text-4xl font-en gold-text leading-none">
                                    {Object.values(stamps).filter(v => v).length}<span className="text-xl text-gray-400">/3</span>
                                </p>
                            </div>
                        </div>
                    </header>

                    <div className="parchment p-6 rounded-xl mb-8 relative overflow-hidden">
                        <h3 className="text-xl font-bold mb-2 text-center text-[#3d2b1f] keep-all relative z-10">
                            {t.map_title.split('\n').map((line, idx) => <React.Fragment key={idx}>{line}<br/></React.Fragment>)}
                        </h3>
                        <p className="text-xs opacity-60 mb-6 text-center keep-all relative z-10 font-bold">{t.map_desc}</p>
                        <div className="flex justify-around gap-2 mb-4 relative z-10">
                            {MISSION_DATA.map(m => (
                                <div key={m.id} onClick={() => setShowHint(m)} className="flex flex-col items-center gap-2">
                                    <div className={`stamp-circle transition-all btn-active cursor-pointer overflow-hidden ${stamps[m.id] ? 'border-[#8b0000] scale-105' : 'border-[#3d2b1f]/20 grayscale opacity-40'}`}>
                                        {m.image ? (
                                            <img src={m.image} className="w-full h-full object-contain p-1" alt={t.mission_labels[m.id]} />
                                        ) : (
                                            <span className="stamp-ink">{m.icon}</span>
                                        )}
                                    </div>
                                    <span className="text-[10px] font-bold opacity-60">{t.mission_labels[m.id]}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="flex-grow flex flex-col justify-center">
                        {allMainRidesDone ? (
                            <div key="treasure-hideout" className="p-8 rounded-3xl border-4 border-[#8b0000] bg-white/80 text-center animate-pulse shadow-[0_20px_50px_rgba(139,0,0,0.3)] relative overflow-hidden">
                                <h3 className="text-2xl font-black mb-4 text-[#3d2b1f] keep-all">{t.map_unlocked_title}</h3>
                                <div className="bg-[#fdf5e6] p-5 rounded-2xl border-2 border-dashed border-[#8b0000]/30 mb-6 shadow-inner">
                                    <p className="text-lg font-bold text-[#8b0000] italic keep-all">
                                        {t.map_unlocked_desc.split('\n').map((line, idx) => <React.Fragment key={idx}>{line}<br/></React.Fragment>)}
                                    </p>
                                </div>
                                <button onClick={() => startScanner('chest')} className="wood-btn text-white font-black py-5 px-8 rounded-2xl w-full text-xl">{t.map_open_chest_btn}</button>
                            </div>
                        ) : (
                            <div key="locked-map-info" className="p-8 text-center bg-[#3d2b1f]/5 rounded-3xl border-2 border-dashed border-[#3d2b1f]/10">
                                <i data-lucide="lock" className="mx-auto mb-4 text-[#3d2b1f]/30" style={{width: 48, height: 48}}></i>
                                <p className="text-base font-bold text-[#3d2b1f]/40 keep-all">
                                    {t.map_locked.split('\n').map((line, idx) => <React.Fragment key={idx}>{line}<br/></React.Fragment>)}
                                </p>
                            </div>
                        )}
                    </div>

                    {showHint && (
                        <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-6 z-50 backdrop-blur-md">
                            <div className="parchment w-full p-10 rounded-2xl text-center shadow-2xl relative border-8 border-double border-[#3d2b1f]/20">
                                <div className="absolute -top-12 left-1/2 -translate-x-1/2 stamp-circle bg-[#fdf5e6] border-4 border-[#8b0000] shadow-xl">
                                    <span className="stamp-ink">{showHint.icon}</span>
                                </div>
                                <div className="mt-8">
                                    <h4 className="text-lg font-black mb-2 text-[#8b0000]">{t.mission_labels[showHint.id]}</h4>
                                    <p className="text-xl mb-10 text-[#3d2b1f] font-bold italic keep-all leading-relaxed">"{t.mission_hints[showHint.id]}"</p>
                                    <div className="flex flex-col gap-4">
                                        <button 
                                            onClick={() => {
                                                setShowHint(null);
                                                startScanner(showHint.id);
                                            }}
                                            className="wood-btn text-white py-5 rounded-2xl font-black flex items-center justify-center gap-3 text-lg btn-active"
                                        >
                                            <i data-lucide="camera" style={{width: 24, height: 24}}></i>
                                            {t.hint_btn_scan}
                                        </button>
                                        <button onClick={()=>setShowHint(null)} className="mt-4 text-[#3d2b1f] font-bold text-sm bg-[#3d2b1f]/5 py-4 rounded-xl">{t.hint_btn_back}</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {newlyUnlockedStamp && (
                        <div className="fixed inset-0 bg-black/85 flex items-center justify-center p-6 z-[100] backdrop-blur-md">
                            <div className="parchment animate-shake w-full max-w-xs p-8 rounded-3xl text-center shadow-2xl border-8 border-double border-[#8b0000]/40 relative overflow-hidden flex flex-col items-center">
                                {/* Decorative elements */}
                                <div className="absolute top-2 left-2 opacity-[0.03]">
                                    <i data-lucide="skull" style={{width: 40, height: 40}}></i>
                                </div>
                                <div className="absolute bottom-2 right-2 opacity-[0.03]">
                                    <i data-lucide="anchor" style={{width: 40, height: 40}}></i>
                                </div>

                                <h3 className="text-2xl font-black text-[#8b0000] tracking-wider mb-2">{t.stamp_success_title}</h3>
                                <p className="text-xs text-gray-500 mb-6 font-bold">{t.stamp_success_subtitle}</p>

                                {/* Stamp Animation Container */}
                                <div className="relative w-44 h-44 my-4 flex items-center justify-center bg-white/20 rounded-full shadow-inner border border-[#3d2b1f]/5">
                                    {MISSION_DATA.find(m => m.id === newlyUnlockedStamp).image ? (
                                        <img 
                                            src={MISSION_DATA.find(m => m.id === newlyUnlockedStamp).image} 
                                            className="w-40 h-40 object-contain animate-stamp-drop" 
                                            alt="Stamped mark" 
                                        />
                                    ) : (
                                        <div className="stamp-circle border-4 border-[#8b0000] w-32 h-32 flex items-center justify-center animate-stamp-drop">
                                            <span className="stamp-ink text-5xl">{MISSION_DATA.find(m => m.id === newlyUnlockedStamp).icon}</span>
                                        </div>
                                    )}
                                </div>

                                <div className="mt-6 mb-8 text-[#3d2b1f] keep-all">
                                    <p className="text-lg font-black mb-1 text-[#8b0000]">
                                        {t.spot_names[newlyUnlockedStamp]}
                                    </p>
                                    <p className="text-[10px] font-bold text-gray-500/60 uppercase tracking-wider mb-2">
                                        {t.mission_labels[newlyUnlockedStamp]}
                                    </p>
                                    <p className="text-sm font-bold text-[#5d4037] leading-relaxed mt-2">
                                        {t.stamp_success_desc(nickname, t.spot_names[newlyUnlockedStamp], t.mission_labels[newlyUnlockedStamp])}
                                    </p>
                                </div>

                                <button 
                                    onClick={() => {
                                        setNewlyUnlockedStamp(null);
                                        // Re-init lucide icons in case any new icon is rendered
                                        setTimeout(() => { if (window.lucide) window.lucide.createIcons(); }, 100);
                                    }} 
                                    className="wood-btn text-white font-black py-4 px-8 rounded-xl w-full text-lg"
                                >
                                    {t.hint_btn_back}
                                </button>
                            </div>
                        </div>
                    )}

                    {isScanning && (
                        <div className="fixed inset-0 bg-black/90 flex flex-col items-center justify-center p-6 z-[200]">
                            <div className="w-full max-w-sm aspect-square bg-black rounded-3xl overflow-hidden relative border-4 border-[#d4af37]">
                                <video ref={videoRef} className="w-full h-full object-cover" />
                                <canvas ref={canvasRef} className="hidden" />
                                <div className="absolute inset-0 border-[40px] border-black/40"></div>
                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-48 border-2 border-[#d4af37] rounded-2xl animate-pulse"></div>
                            </div>
                            <p onClick={handleSecretTap} className="text-white mt-8 text-lg font-bold text-center keep-all font-ko select-none">
                                {scanModeRef.current === 'chest' && (
                                    lang === 'ko' 
                                        ? <>보물 상자의<br/><span className="text-[#d4af37]">QR 코드</span>를 인식시켜주세요</>
                                        : <>Please scan the<br/><span className="text-[#d4af37]">QR code</span> of the Treasure Chest</>
                                )}
                                {scanModeRef.current === 'reward' && (
                                    lang === 'ko'
                                        ? <>스태프용 보상 확인<br/><span className="text-[#d4af37]">QR 코드</span>를 인식시켜주세요</>
                                        : <>Please scan the staff's<br/><span className="text-[#d4af37]">verification QR code</span></>
                                )}
                                {['swingship', 'splash', 'flume'].includes(scanModeRef.current) && (
                                    lang === 'ko'
                                        ? <>해적단의<br/><span className="text-[#d4af37]">표식 QR 코드</span>를 인식시켜주세요</>
                                        : <>Please scan the pirate's<br/><span className="text-[#d4af37]">Mark QR code</span></>
                                )}
                            </p>

                            <button 
                                onClick={stopScanner}
                                className="mt-8 px-8 py-3 bg-white/10 text-white rounded-full font-bold border border-white/20 text-sm"
                            >
                                {t.scan_cancel}
                            </button>
                        </div>
                    )}
                    {resetModalJSX}
                </div>
            );

            if (step === 'ending') return (
                <div 
                    className="mobile-app-container font-ko p-8 flex flex-col items-center justify-center text-center min-h-screen cursor-pointer animate-[storyFadeIn_0.8s_ease-out]"
                    onClick={() => setVisibleLines(prev => prev + 1)}
                >
                    <div className="real-parchment space-y-6 text-lg font-bold keep-all leading-relaxed text-[#2c1e13] w-full relative overflow-hidden">
                        {/* 킹받는 해적 두목 배경 워터마크 추가 */}
                        <div className="absolute inset-0 z-0 flex items-center justify-center opacity-[0.06] pointer-events-none select-none">
                            <img src="laughing_pirate_captain.png" className="w-full h-auto object-contain scale-110" />
                        </div>
                        
                        <div className="relative z-10 space-y-6">
                            <p className="story-line text-xl font-black" style={visibleLines >= 1 ? {opacity:1, animation:'none'} : {animationDelay:'0.5s'}}>{t.ending_line1}</p>
                            <p className="story-line text-sm text-[#2c1e13]/80" style={visibleLines >= 2 ? {opacity:1, animation:'none'} : {animationDelay:'2s'}}>
                                {t.ending_line2.split('\n').map((line, idx) => <React.Fragment key={idx}>{line}<br/></React.Fragment>)}
                            </p>
                            
                            <div className="py-3 px-4 border-y border-dashed border-[#8b0000]/20 story-line italic text-base relative" style={visibleLines >= 3 ? {opacity:1, animation:'none'} : {animationDelay:'4.5s'}}>
                                {t.ending_line3.split('\n').map((line, idx) => <React.Fragment key={idx}>{line}<br/></React.Fragment>)}
                            </div>

                            <p className="story-line text-lg text-[#8b0000] italic font-black" style={visibleLines >= 4 ? {opacity:1, animation:'none'} : {animationDelay:'7s'}}>{t.ending_line4}</p>
                            
                            <div className="story-line space-y-1" style={visibleLines >= 5 ? {opacity:1, animation:'none'} : {animationDelay:'9s'}}>
                                <p className="text-2xl text-[#8b0000] font-black">{t.ending_line5_title}</p>
                                <p className="text-base">{t.ending_line5_desc.split('\n').map((line, idx) => <React.Fragment key={idx}>{line}<br/></React.Fragment>)}</p>
                            </div>
                        </div>
                    </div>

                    <div className="w-full mt-6 px-2">
                        <button 
                            onClick={(e)=>{e.stopPropagation(); setStep('reward');}} 
                            className="wood-btn text-white font-black py-5 px-6 rounded-2xl w-full text-xl story-line" 
                            style={visibleLines >= 6 ? {opacity:1, animation:'none'} : {animationDelay:'11s'}}
                        >
                            {t.ending_btn}
                        </button>
                    </div>
                    {resetModalJSX}
                </div>
            );

            if (step === 'reward') return (
                <div className="mobile-app-container font-ko p-6 pb-12 flex flex-col items-center min-h-screen relative">
                    <div className="absolute top-4 right-4 z-[100] flex gap-1.5">
                        <button 
                            onClick={() => changeLang('ko')} 
                            className={`px-2 py-0.5 rounded text-[10px] font-bold transition-all border ${lang === 'ko' ? 'bg-[#8b0000] text-white border-[#8b0000]' : 'bg-white/80 text-[#3d2b1f] border-gray-300'}`}
                        >
                            한글
                        </button>
                        <button 
                            onClick={() => changeLang('en')} 
                            className={`px-2 py-0.5 rounded text-[10px] font-bold transition-all border ${lang === 'en' ? 'bg-[#8b0000] text-white border-[#8b0000]' : 'bg-white/80 text-[#3d2b1f] border-gray-300'}`}
                        >
                            EN
                        </button>
                    </div>

                    <div ref={certificateRef} className="relative w-full bg-[#fdf5e6] p-10 border-[16px] border-double border-[#8b0000] shadow-2xl text-center mt-6 overflow-hidden">
                        {/* 배경 이미지 추가 */}
                        <div className="absolute inset-0 z-0 flex items-center justify-center opacity-[0.15]">
                            <img src="image_nobg.png" className="w-full h-auto object-contain scale-125" />
                        </div>
                        
                        <div className="relative z-10">
                            <div className="absolute top-0 left-0 opacity-10 rotate-[-45deg]">
                                <i data-lucide="anchor" style={{width: 60, height: 60}}></i>
                            </div>
                            <div className="absolute bottom-0 right-0 opacity-10 rotate-[15deg]">
                                <i data-lucide="compass" style={{width: 60, height: 60}}></i>
                            </div>

                            <h2 className="text-5xl font-en gold-text mb-4 uppercase tracking-tighter">{t.reward_cert_title}</h2>
                            <p className="text-sm font-bold text-[#3d2b1f]/60 mb-10 border-b-2 border-[#3d2b1f]/10 pb-4 tracking-[0.3em] uppercase text-center">{t.reward_cert_subtitle}</p>
                            
                            <div className="space-y-6 mb-12">
                                {lang === 'ko' ? (
                                    <p className="text-xl mb-4 font-bold leading-loose keep-all text-[#3d2b1f]">
                                        위 사람은 보물찾기로 위장된 <br/>
                                        <span className="font-black text-3xl text-[#8b0000] my-2 inline-block drop-shadow-sm">낭만 해적단</span>의 <br/>
                                        입단 테스트를 훌륭히 통과하였기에 <br/>
                                        정식 단원으로 임명함.
                                    </p>
                                ) : (
                                    <p className="text-lg mb-4 font-bold leading-loose keep-all text-[#3d2b1f]">
                                        This adventurer has successfully passed<br/>
                                        the admission test of the<br/>
                                        <span className="font-black text-2xl text-[#8b0000] my-2 inline-block drop-shadow-sm">Romantic Pirates</span><br/>
                                        disguised as a treasure hunt,<br/>
                                        and is hereby appointed as an official member.
                                    </p>
                                )}
                                <div className="relative py-4">
                                    <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-[#3d2b1f]/10"></div></div>
                                    <p className="relative bg-[#fdf5e6]/80 px-4 text-5xl font-black italic text-[#3d2b1f]">"{nickname}"</p>
                                </div>
                            </div>

                            <div className="flex justify-center items-end border-t border-[#3d2b1f]/10 pt-4">
                                <div className="text-center">
                                    <p className="text-[10px] font-bold text-[#3d2b1f]/40 tracking-widest uppercase mb-1">{t.reward_cert_date}</p>
                                    <p className="text-sm font-black text-[#3d2b1f]">
                                        {new Date().toLocaleDateString(lang === 'ko' ? 'ko-KR' : 'en-US', { year: 'numeric', month: 'long', day: 'numeric' })}
                                    </p>
                                </div>
                            </div>
                        </div>

                        {/* 수령 완료 도장 */}
                        {isClaimed && (
                            <div className="stamp-collected stamp-anim">
                                COLLECTED
                            </div>
                        )}
                    </div>

                    <div className="mt-10 w-full space-y-6 relative z-10">
                        {!isClaimed ? (
                            <div key="claim-reward-form" className="parchment border-4 border-[#8b0000]/20 p-8 rounded-3xl text-[#3d2b1f] shadow-xl text-center keep-all relative">
                                <div className="absolute -top-5 left-1/2 -translate-x-1/2 bg-[#8b0000] text-[#d4af37] px-6 py-2 rounded-full text-sm font-black shadow-lg border-2 border-[#d4af37] uppercase tracking-wider">
                                    {t.reward_box_title}
                                </div>
                                {lang === 'ko' ? (
                                    <p className="text-lg font-bold leading-relaxed mt-4">
                                        현재 화면을 <span className="font-extrabold text-[#8b0000] bg-yellow-200/80 px-2 py-0.5 rounded-lg mx-1 shadow-sm">레인보우카페</span>의 직원에게 보여주세요!<br/>
                                        낭만 해적단원의 무기를 지급해 드립니다!<br/>
                                        <span className="text-sm font-bold text-[#8b0000]/80 mt-2 block">(1인 1회 한정, 중복 수령 불가)</span>
                                    </p>
                                ) : (
                                    <p className="text-base font-bold leading-relaxed mt-4">
                                        Please show this screen to the staff at <span className="font-extrabold text-[#8b0000] bg-yellow-200/80 px-2 py-0.5 rounded-lg mx-1 shadow-sm">Rainbow Cafe</span>!<br/>
                                        We will issue your pirate weapon toy!<br/>
                                        <span className="text-xs font-bold text-[#8b0000]/80 mt-2 block">(Limit 1 per person, no duplicates)</span>
                                    </p>
                                )}
                                
                                <button 
                                    onClick={() => startScanner('reward')} 
                                    className="mt-6 mx-auto px-8 py-4 bg-[#3d2b1f] text-white rounded-xl font-bold text-base shadow-md active:scale-95 transition-transform flex items-center justify-center gap-2 w-auto"
                                >
                                    <i data-lucide="camera" style={{width: 20, height: 20}}></i>
                                    {t.reward_btn_claim}
                                </button>
                            </div>
                        ) : (
                            <div key="reward-claimed-status" className="bg-[#8b0000]/5 border-4 border-dashed border-[#8b0000]/20 p-8 rounded-3xl text-[#8b0000] shadow-inner text-center keep-all">
                                <i data-lucide="check-circle" className="mx-auto mb-2" style={{width: 32, height: 32}}></i>
                                <p className="text-xl font-black mb-1">{t.reward_claimed_title}</p>
                                <p className="text-sm font-bold opacity-70">
                                    {t.reward_claimed_time}: {claimedAt ? new Date(claimedAt).toLocaleString(lang === 'ko' ? 'ko-KR' : 'en-US') : ""}<br/>
                                    ({elapsedSeconds < 60 ? `${elapsedSeconds}${t.time_sec}` : 
                                      Math.floor(elapsedSeconds / 60) < 60 ? `${Math.floor(elapsedSeconds / 60)}${t.time_min}` : 
                                      Math.floor(elapsedSeconds / 3600) < 24 ? `${Math.floor(elapsedSeconds / 3600)}${t.time_hour}` : 
                                      `${Math.floor(elapsedSeconds / 86400)}${t.time_day}`})
                                </p>
                            </div>
                        )}

                        <button onClick={()=> {setStep('intro'); window.scrollTo(0,0);}} className="w-full text-base font-bold text-[#3d2b1f]/60 underline mt-4">{t.reward_btn_home}</button>
                        
                        <div className="pt-16 pb-8 flex flex-col items-center">
                            {/* 데이터 초기화 버튼 숨김 */}
                        </div>
                    </div>

                    {isScanning && (
                        <div className="fixed inset-0 bg-black/90 flex flex-col items-center justify-center p-6 z-[200]">
                            <div className="w-full max-w-sm aspect-square bg-black rounded-3xl overflow-hidden relative border-4 border-[#d4af37]">
                                <video ref={videoRef} className="w-full h-full object-cover" />
                                <canvas ref={canvasRef} className="hidden" />
                                <div className="absolute inset-0 border-[40px] border-black/40"></div>
                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-48 border-2 border-[#d4af37] rounded-2xl animate-pulse"></div>
                            </div>
                            <p onClick={handleSecretTap} className="text-white mt-8 text-lg font-bold text-center keep-all font-ko select-none">
                                {scanModeRef.current === 'chest' && (
                                    lang === 'ko' 
                                        ? <>보물 상자의<br/><span className="text-[#d4af37]">QR 코드</span>를 인식시켜주세요</>
                                        : <>Please scan the<br/><span className="text-[#d4af37]">QR code</span> of the Treasure Chest</>
                                )}
                                {scanModeRef.current === 'reward' && (
                                    lang === 'ko'
                                        ? <>스태프용 보상 확인<br/><span className="text-[#d4af37]">QR 코드</span>를 인식시켜주세요</>
                                        : <>Please scan the staff's<br/><span className="text-[#d4af37]">verification QR code</span></>
                                )}
                                {['swingship', 'splash', 'flume'].includes(scanModeRef.current) && (
                                    lang === 'ko'
                                        ? <>해적단의<br/><span className="text-[#d4af37]">표식 QR 코드</span>를 인식시켜주세요</>
                                        : <>Please scan the pirate's<br/><span className="text-[#d4af37]">Mark QR code</span></>
                                )}
                            </p>

                            <button 
                                onClick={stopScanner}
                                className="mt-8 px-8 py-3 bg-white/10 text-white rounded-full font-bold border border-white/20 text-sm"
                            >
                                {t.scan_cancel}
                            </button>
                        </div>
                    )}

                    {resetModalJSX}
                    {passcodeModalJSX}
                    {successAnimationJSX}
                </div>
            );
            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        const initIcons = () => { if (window.lucide) { window.lucide.createIcons(); } else { setTimeout(initIcons, 100); } };
        initIcons();
    </script>
</body>
</html>
